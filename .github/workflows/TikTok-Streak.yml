name: TikTok Streak

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  streak:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run TikTok Streak
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: node index.js
